[project]
name = "g1dance"
version = "0.1.0"
description = "Make a Unitree G1 dance from a video, zero shot, in simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "opencv-python>=4.10",
  "mediapipe>=0.10",
  "yt-dlp>=2024.1",
  "scenedetect>=0.6",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
fingers = ["dex-retargeting>=0.5.0"]
# The loader for the SMPL-X body model. The package is permissively licensed;
# the model files it reads are not, and are neither shipped nor downloaded.
# See motion/bodymodel.py and the licensing section of the README.
bodymodel = ["smplx>=0.1.28", "torch>=2.4"]
# A second retargeting backend. MIT, CPU, and it needs the body model above
# because it works from SMPL-X parameters rather than from landmarks.
gmr = ["general_motion_retargeting @ git+https://github.com/YanjieZe/GMR"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
g1dance = "g1dance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g1dance"]

[tool.pytest.ini_options]
# Tests that load a multi-gigabyte network or run one over real video are
# marked `slow` and deselected by default: with them in, the suite takes over
# ten minutes and stops being something anyone runs. They are the end-to-end
# checks for the SMPL-X estimators, and CI or a release check should run
# `pytest -m slow` as well.
# Only this project's tests. Without it a bare `pytest` walks the repository
# root and recurses into `third_party/`, whose checkouts ship their own test
# files; collecting those imports GVHMR's visual-odometry bench and hangs before
# a single test of ours runs.
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: loads a large model or runs one over video; run with -m slow",
]
